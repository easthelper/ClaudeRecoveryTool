name: Windows validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build application and tests
        shell: powershell
        run: .\source\Build.ps1 -OutputDirectory .\test-build -Tests

      - name: Run regression and Win32 integration tests
        shell: powershell
        run: .\test-build\ClaudeRecoveryTests.exe .\test-results

      - name: Upload validated build and test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-validation
          path: |
            test-build/ClaudeRecoveryTool.exe
            test-build/ClaudeRecoveryTests.exe
            test-results/
          if-no-files-found: warn
